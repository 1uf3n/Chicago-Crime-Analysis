name: Refresh fixed study window
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 15 * *'
permissions:
  contents: read
concurrency:
  group: chicago-etl
  cancel-in-progress: false
jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python src/pipeline.py
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chicago-crime-run
          path: |
            reports/
            data/raw/
            data/crimes.sqlite
          retention-days: 30
